
name: build-test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: python-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Build application
        run: echo "Build completed successfully"
      - name: Create build output
        run: echo "My first GitHub Actions artifact" > build-output.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-build-output
          path: build-output.txt
      - name: Display project name
        run: echo "Project name is $PROJECT_NAME"
      - name: Use GitHub Secret
        run: echo "Secret is configured"
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run Python tests
        run: python -m unittest test_app.py

